<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>SPA Example with Routing</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        margin: 20px;
      }

      nav a {
        display: inline-block;
        padding: 10px 20px;
        font-size: 18px;
        margin: 5px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        transition: background-color 0.3s;
      }

      nav a:hover {
        background-color: #0056b3;
      }

      .page {
        display: none;
        border: 1px solid #ccc;
        padding: 20px;
        margin-top: 20px;
        border-radius: 8px;
        background-color: #f9f9f9;
      }

      .active {
        display: block;
      }
    </style>
  </head>
  <body>
    
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>

    <div id="home" class="page">
      <h1>דף הבית</h1>
      <p>Welcome to home page</p>
    </div>

    <div id="about" class="page">
      <h1>אודות</h1>
      <p>About page.....</p>
    </div>

    <div id="contact" class="page">
      <h1>צור קשר</h1>
      <p>hey how are you?</p>
    </div>

    <script src="main.js"></script>
  </body>
</html>
